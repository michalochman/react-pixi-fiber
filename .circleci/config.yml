version: 2
jobs:
  build:
    docker:
      - image: cimg/node:24.15.0

    working_directory: ~/react-pixi-fiber

    steps:
      - checkout

      # pnpm version comes from the packageManager field in package.json
      - run: sudo corepack enable

      # Download and cache dependencies
      - restore_cache:
          keys:
          - pnpm-store-{{ checksum ".nvmrc" }}-{{ checksum "pnpm-lock.yaml" }}
          # fallback to using the latest cache if no exact match is found
          - pnpm-store-

      - run: pnpm install --frozen-lockfile

      # Cache dependencies
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: pnpm-store-{{ checksum ".nvmrc" }}-{{ checksum "pnpm-lock.yaml" }}

      # run build
      - run: pnpm build

      # run tests
      # Cap workers: jest sizes its pool from the host CPU count and OOMs the 4 GB container.
      - run: pnpm --filter react-pixi-fiber test:dev --ci --maxWorkers=2
      - run: pnpm --filter react-pixi-fiber test:prod --ci --maxWorkers=2

      # typecheck the TypeScript fixture and the examples against the local index.d.ts
      - run: pnpm check-types

      # upload coverage report
      # TODO: Migrate to new uploader
      # - run: npm exec codecov
