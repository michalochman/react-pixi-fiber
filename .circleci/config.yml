version: 2
jobs:
  build:
    docker:
      - image: cimg/node:24.15.0

    working_directory: ~/react-pixi-fiber

    steps:
      - checkout

      # pnpm version comes from the packageManager field in package.json
      - run: sudo corepack enable

      # Download and cache dependencies
      - restore_cache:
          keys:
          - pnpm-store-{{ checksum ".nvmrc" }}-{{ checksum "pnpm-lock.yaml" }}
          # fallback to using the latest cache if no exact match is found
          - pnpm-store-

      - run: pnpm install --frozen-lockfile

      # Cache dependencies
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: pnpm-store-{{ checksum ".nvmrc" }}-{{ checksum "pnpm-lock.yaml" }}

      # check formatting and lint
      - run: pnpm lint

      # run build
      - run: pnpm build

      # check the packed packages with publint and attw, and which files Node and esbuild resolve
      - run: pnpm check-package

      # run tests
      # Cap workers: vitest sizes its pool from the host CPU count and OOMs the 4 GB container.
      - run: pnpm -r --workspace-concurrency=1 test:dev --maxWorkers=2
      - run: pnpm -r --workspace-concurrency=1 test:prod --maxWorkers=2

      # typecheck the library source, the TypeScript fixture, and the examples against the built declarations
      - run: pnpm check-types
