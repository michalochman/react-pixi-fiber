version: 2
jobs:
  build:
    docker:
      - image: cimg/node:24.15.0

    working_directory: ~/react-pixi-fiber

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - npm-dependencies-{{ checksum ".nvmrc" }}-{{ checksum "package-lock.json" }}
          # fallback to using the latest cache if no exact match is found
          - npm-dependencies-

      - run: npm ci

      # Cache dependencies
      - save_cache:
          paths:
            - node_modules
          key: npm-dependencies-{{ checksum ".nvmrc" }}-{{ checksum "package-lock.json" }}

      # run build
      - run: npm run build

      # run tests
      # Cap workers: jest sizes its pool from the host CPU count and OOMs the 4 GB container.
      - run: npm run test:dev -- --ci --maxWorkers=2
      - run: npm run test:prod -- --ci --maxWorkers=2
      - run: npm run test:ts

      # typecheck examples against local index.d.ts
      - run: cd examples && npm ci && sh link.sh && npm run check-types

      # upload coverage report
      # TODO: Migrate to new uploader
      # - run: npm exec codecov
